seed: 42

paths:
  data_root: data/raw
  checkpoints: checkpoints
  outputs: outputs

data:
  dataset: kvasir
  input_mode: rgb
  image_size: 352
  num_workers: 4
  pin_memory: true

model:
  name: esfpnet
  model_type: b2
  num_classes: 1
  in_channels: 3
  pretrained_path: weights/mit_b2.pth

training:
  loss: structure
  epochs: 200
  batch_size: 8
  optimizer:
    name: adam
    lr: 1.0e-4
    weight_decay: 1.0e-5
  scheduler:
    name: cosine
    min_lr: 1.0e-6

logging:
  log_every_n_epochs: 5

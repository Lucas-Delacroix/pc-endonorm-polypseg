defaults:
  - ../base

model:
  model_type: b2
  in_channels: 3
  pretrained_path: weights/mit_b2.pth

data:
  input_mode: rgb

augmentation:
  strong_style:
    enabled: false
  fourier:
    enabled: true
    p: 0.5
    beta: 0.05
    strength: 0.15
    low_freq_only: true

training:
  loss: structure

logging:
  run_name: H_aug_fourier

defaults:
  - ../base

model:
  model_type: b2
  in_channels: 3
  pretrained_path: weights/mit_b2.pth

data:
  input_mode: rgb

augmentation:
  strong_style:
    enabled: false
  fourier:
    enabled: false
  randconv:
    enabled: true
    p: 0.3
    kernel_sizes: [1, 3, 5]
    mix_alpha_min: 0.1
    mix_alpha_max: 0.35
    depthwise: true
    normalize_kernel: true
    normalize_output: true
    same_kernel_per_channel: false

training:
  loss: structure

logging:
  run_name: R_randconv
